# DISABLED — GitHub-hosted CI is paused (no spend on Actions or billing).
# GitHub only runs workflows located in .github/workflows/, so this file is inert here.
# Local equivalent:  pnpm verify   (see scripts/verify.mjs)
# To re-enable later (OWNER APPROVAL REQUIRED, A11):
#   git mv ci/github-actions.disabled.yml .github/workflows/ci.yml
# Cost: free for public repositories; for private ones each run uses roughly
# 10–15 Actions minutes of the account's monthly allowance. Earlier runs never
# got a runner (account/billing block), so check the account first.
# Runs the same single command as local verification.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, tests, build, browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    # CI-only values. Nothing here is a real secret; production secrets live
    # in the host's secret manager (see docs/deployment.md).
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/moonuke
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/moonuke_test
      APP_SECRET: ci-only-not-a-secret-ci-only-not-a-secret-00
      APP_URL: http://localhost:3000
      TRUSTED_PROXY: none
      EMAIL_TRANSPORT: dev
      ALLOW_LOCAL_PRODUCTION: "true"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: PostgreSQL client matching the server (pg_dump for the restore drill)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-16 || true

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Full verification (typecheck, audit, unit + PostgreSQL security tests, build, env check, all browser suites, restore drill)
        run: pnpm verify

      - name: Upload report, logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-report
          path: reports/
          retention-days: 7
